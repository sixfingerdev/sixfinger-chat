name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Varsayılan sunucu adresi (https://...). Boş bırakılırsa uygulama ilk açılışta sorar.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Web arayüzünü derle
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.API_URL }}
        run: npm run build -w @sixfinger/web

      - name: Capacitor senkronu
        working-directory: apps/web
        run: npx cap sync android

      - name: İmza anahtarını hazırla (varsa)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Anahtar tanımlı değil: APK debug anahtarıyla imzalanacak."
          fi

      - name: APK derle
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}

      - uses: actions/upload-artifact@v4
        with:
          name: sixfinger-apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Sürüme ekle (tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/android/app/build/outputs/apk/release/*.apk
