# Render Blueprint: tek web servisi (API + arayüz) ve yönetilen Postgres.
# Dashboard → New → Blueprint ile bu repoyu bağla.
databases:
  - name: sixfinger-db
    plan: free
    databaseName: sixfinger
    user: sixfinger

services:
  - type: web
    name: sixfinger-chat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sixfinger-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      # Servis adresin (ör. https://sixfinger-chat.onrender.com). İlk dağıtımdan sonra güncelle.
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
